# Name
spring.application.name=back-end
# Server
server.port=9090
# Database
spring.datasource.url=jdbc:mysql://localhost:3306/graduation_design?useUnicode=true&characterEncoding=utf-8&useSSL=false
spring.datasource.username=DbUser
spring.datasource.password=dbuser
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Mybatis
mybatis.type-aliases-package=com.wcw.backend.entity
mybatis.mapper-locations=classpath:mapper/*.xml
# DateFormat
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest